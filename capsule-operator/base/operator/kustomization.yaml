apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
helmCharts:
  - repo: oci://ghcr.io/projectcapsule/charts
    name: capsule
    version: 0.13.9
    releaseName: capsule
    namespace: capsule-system
    skipHooks: true
    skipTests: true
    includeCRDs: true
    valuesFile: values.yaml
