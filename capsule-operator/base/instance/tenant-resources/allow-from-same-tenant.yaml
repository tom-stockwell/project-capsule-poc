apiVersion: capsule.clastix.io/v1beta2
kind: GlobalTenantResource
metadata:
  name: allow-from-same-tenant
spec:
  resyncPeriod: 60s
  pruningOnDelete: true
  tenantSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: Exists
  resources:
    - rawItems:
        - apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-from-same-tenant
          spec:
            podSelector: {}
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        tenant.example.com/name: "{{ tenant.name }}"
            policyTypes:
              - Ingress
