apiVersion: policy.networking.k8s.io/v1alpha1
kind: BaselineAdminNetworkPolicy
metadata:
  name: default
spec:
  ingress:
    # note: ingress is not being denied here as the router uses the host network and is on the same node as the pod
    - name: default-deny
      action: Allow
      from:
        - namespaces:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: Exists

  subject:
    namespaces:
      matchExpressions:
        - key: tenant.example.com/name
          operator: Exists
