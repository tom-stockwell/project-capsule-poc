apiVersion: policy.networking.k8s.io/v1alpha1
kind: BaselineAdminNetworkPolicy
metadata:
  name: default
spec:
  ingress:
    - name: default-ingress
      action: Allow
      from:
        - namespaces:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
  subject:
    namespaces:
      matchExpressions:
        - key: capsule.clastix.io/tenant
          operator: Exists
